    .card { background: #071b12; padding: 16px; border-radius: 20px; width: 100%; max-width: 380px; margin-bottom: 14px; border: 1px solid rgba(16, 185, 129, 0.3); box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

    .visualizer { width: 40px; height: 18px; background: rgba(0,0,0,0.4); border-radius: 6px; display: block; border: 1px solid rgba(16, 185, 129, 0.25); }

    /* 雷达声场画布 */
    .radar-container { position: relative; width: 100%; height: 110px; background: rgba(0,0,0,0.5); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(16, 185, 129, 0.25); overflow: hidden; margin-bottom: 8px; }
    canvas#radarCanvas { display: block; }

    /* 视频预览区 */
    .video-preview-container { position: relative; width: 100%; height: 140px; background: rgba(0,0,0,0.7); border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(16, 185, 129, 0.25); overflow: hidden; margin-bottom: 8px; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; border-radius: 12px; }

    input[type="file"] { width: 100%; margin: 4px 0; color: #a7f3d0; font-size: 11px; }
    input[type="file"]::file-selector-button { background: #047857; color: #a7f3d0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; }

    button { width: 100%; padding: 9px; margin: 3px 0; background: #059669; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s ease; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button.off { background: #0c261b; color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.15); }
    button.export-btn { background: #047857; border: 1px solid #34d399; font-weight: 600; }
    button:disabled { opacity: 0.25; transform: none; cursor: not-allowed; }

    .select-box { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 12px; padding: 7px 10px; margin-top: 6px; display: flex; align-items: center; justify-content: space-between; }
    .select-box label { font-size: 11px; color: #a7f3d0; font-weight: 500; }
    .select-box select { background: #03130a; color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 5px 8px; border-radius: 8px; font-size: 11px; outline: none; width: 58%; font-weight: 600; cursor: pointer; max-height: 140px; }

    .dual-slider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
    .slider-box { background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.15); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #a7f3d0; }
    .slider-header span:last-child { font-weight: 600; color: #d1fae5; }
    
    input[type="range"].horizontal {
      -webkit-appearance: none; width: 100%; height: 5px; background: rgba(16, 185, 129, 0.2); border-radius: 3px; outline: none; margin: 3px 0;
    }
    input[type="range"].horizontal::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #34d399; cursor: pointer; box-shadow: 0 0 10px rgba(52,211,153,0.9);

    .tip { font-size: 10px; color: #34d399; margin-top: 6px; text-align: center; opacity: 0.9; }

</div>

<script>
// --- 通用音效滤镜解析函数 ---
function resetFilters(f1, f2) {
  if(!f1 || !f2) return;
  f1.type = 'allpass'; f1.frequency.value = 1000; f1.Q.value = 1; f1.gain.value = 0;
  f2.type = 'allpass'; f2.frequency.value = 1000; f2.Q.value = 1; f2.gain.value = 0;
}

function applyPresetEffect(fx, f1, f2, intensity = 1.0) {
  resetFilters(f1, f2);
  switch(fx) {
    case 'normal': break;
    case 'bass': f1.type = 'lowshelf'; f1.frequency.value = 250; f1.gain.value = 15 * intensity; break;
    case 'xbass': f1.type = 'lowshelf'; f1.frequency.value = 120; f1.gain.value = 24 * intensity; f2.type = 'peaking'; f2.frequency.value = 60; f2.gain.value = 14 * intensity; break;
    case 'subbass': f1.type = 'lowshelf'; f1.frequency.value = 80; f1.gain.value = 22 * intensity; f2.type = 'highpass'; f2.frequency.value = 30; break;
    case 'vocal': f1.type = 'peaking'; f1.frequency.value = 1500; f1.gain.value = 8 * intensity; f2.type = 'highpass'; f2.frequency.value = 120; break;
    case 'podcast': f1.type = 'lowshelf'; f1.frequency.value = 200; f1.gain.value = 6 * intensity; f2.type = 'peaking'; f2.frequency.value = 2500; f2.gain.value = 5 * intensity; break;
    case 'live': f1.type = 'peaking'; f1.frequency.value = 600; f1.Q.value = 0.5; f1.gain.value = 6 * intensity; f2.type = 'highshelf'; f2.frequency.value = 4000; f2.gain.value = 5 * intensity; break;
    case 'cathedral': f1.type = 'peaking'; f1.frequency.value = 400; f1.Q.value = 0.3; f1.gain.value = 8 * intensity; f2.type = 'highshelf'; f2.frequency.value = 3000; f2.gain.value = 7 * intensity; break;
    case 'vinyl': f1.type = 'lowpass'; f1.frequency.value = 4000; f2.type = 'highpass'; f2.frequency.value = 100; break;
    case 'lofi': f1.type = 'lowpass'; f1.frequency.value = 2200; f2.type = 'highpass'; f2.frequency.value = 300; break;
    case 'space8d': f1.type = 'peaking'; f1.frequency.value = 2500; f1.gain.value = 8 * intensity; break;
    case 'ether': f1.type = 'bandpass'; f1.frequency.value = 3200; f1.Q.value = 0.4; f2.type = 'highpass'; f2.frequency.value = 400; break;
    case 'telephone': f1.type = 'bandpass'; f1.frequency.value = 1000; f1.Q.value = 2; break;
    case 'radio': f1.type = 'highpass'; f1.frequency.value = 1500; f1.Q.value = 2; f2.type = 'lowshelf'; f2.frequency.value = 300; f2.gain.value = -12 * intensity; break;
    case 'muffled': f1.type = 'lowpass'; f1.frequency.value = 350; break;
    case 'treble': f1.type = 'highshelf'; f1.frequency.value = 3000; f1.gain.value = 15 * intensity; break;
    case 'airiness': f1.type = 'highshelf'; f1.frequency.value = 8000; f1.gain.value = 12 * intensity; break;
    case 'studio': f1.type = 'highshelf'; f1.frequency.value = 5000; f1.gain.value = 5 * intensity; f2.type = 'lowshelf'; f2.frequency.value = 120; f2.gain.value = 4 * intensity; break;
    case 'edm': f1.type = 'peaking'; f1.frequency.value = 10000; f1.gain.value = 10 * intensity; f2.type = 'lowshelf'; f2.frequency.value = 150; f2.gain.value = 12 * intensity; break;
    case 'cyberpunk': f1.type = 'bandpass'; f1.frequency.value = 2000; f1.Q.value = 3; f2.type = 'peaking'; f2.frequency.value = 4000; f2.gain.value = 10 * intensity; break;
    case 'theater': f1.type = 'peaking'; f1.frequency.value = 400; f1.Q.value = 0.8; f2.type = 'highshelf'; f2.frequency.value = 6000; f2.gain.value = 6 * intensity; break;
    default:
      let codeNum = parseInt(fx.replace('fx','')) || 30;
      f1.type = (codeNum % 2 === 0) ? 'peaking' : 'bandpass';
      f1.frequency.value = 300 + (codeNum * 80) % 6000;
      f1.Q.value = 0.5 + (codeNum % 5);
      f1.gain.value = ((codeNum % 15) - 5) * intensity;
      break;
  }
}

// --- 音频区引擎状态 ---
let aCtx, aPanner, aEq1, aEq2, aGain, aAnalyser, aBuf, aSrc;
let aPlayState = false, aLoopState = false, animId = null;
let angle = 0;

const aFile = document.getElementById('aFile');
const aPlay = document.getElementById('aPlay');
const aStop = document.getElementById('aStop');
const aLoop = document.getElementById('aLoop');
const aStatus = document.getElementById('aStatus');
const aVol = document.getElementById('aVol');
const aVolVal = document.getElementById('aVolVal');
const aFxInt = document.getElementById('aFxInt');
const aFxIntVal = document.getElementById('aFxIntVal');
const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
const spatialMode = document.getElementById('spatialMode');
const aFxSelect = document.getElementById('aFxSelect');
const aCanvas = document.getElementById('aCanvas');
const aCanvasCtx = aCanvas.getContext('2d');
const radarCanvas = document.getElementById('radarCanvas');
const radarCtx = radarCanvas.getContext('2d');
const aExportBtn = document.getElementById('aExportBtn');

function initAudioContext() {
  if (aCtx) return;
  aCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  aPanner = aCtx.createPanner();
  aPanner.panningModel = 'HRTF';
  aPanner.distanceModel = 'inverse';
  aPanner.refDistance = 1;
  aPanner.maxDistance = 10000;
  aPanner.rolloffFactor = 1;
  aPanner.positionX.value = 0;
  aPanner.positionY.value = 0;
  aPanner.positionZ.value = -1;

  aEq1 = aCtx.createBiquadFilter();
  aEq2 = aCtx.createBiquadFilter();
  aAnalyser = aCtx.createAnalyser();
  aAnalyser.fftSize = 32;
  aGain = aCtx.createGain();
  aGain.gain.value = aVol.value / 100;
  
  aPanner.connect(aEq1);
  aEq1.connect(aEq2);
  aEq2.connect(aAnalyser);
  aAnalyser.connect(aGain);
  aGain.connect(aCtx.destination);
}

aFile.addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  initAudioContext();
  if (aCtx.state === 'suspended') aCtx.resume();
  aStatus.textContent = "正在加载解码音频...";
  try {
    const arrayBuffer = await file.arrayBuffer();
    aBuf = await aCtx.decodeAudioData(arrayBuffer);
    aPlay.disabled = false;
    aStop.disabled = false;
    aLoop.disabled = false;
    aExportBtn.disabled = false;
    aStatus.textContent = "✅ 音频加载完毕，音效与8D引擎就绪";
  } catch(err) {
    aStatus.textContent = "❌ 解码失败，请更换 MP3/WAV 文件";
  }
});

aFxSelect.addEventListener('change', e => {
  if (!aCtx) initAudioContext();
  applyPresetEffect(e.target.value, aEq1, aEq2, aFxInt.value / 100);
  aStatus.textContent = `已同步音效: ${e.options[e.selectedIndex].text}`;
});

aFxInt.addEventListener('input', e => {
  const val = e.target.value;
  aFxIntVal.textContent = val + '%';
  if (aCtx && aEq1) {
    applyPresetEffect(aFxSelect.value, aEq1, aEq2, val / 100);
  }
});

aPlay.addEventListener('click', () => {
  if (aSrc) { try { aSrc.stop(); aSrc.disconnect(); } catch(e){} aSrc = null; }
  initAudioContext();
  if (aCtx.state === 'suspended') aCtx.resume();

  aSrc = aCtx.createBufferSource();
  aSrc.buffer = aBuf;
  aSrc.loop = aLoopState;
  
  aSrc.connect(aPanner);
  aSrc.start(0);
  aPlayState = true;
  
  aPlay.classList.remove('off');
  aStop.classList.add('off');
  aStatus.textContent = "▶ 8D 动态全景环绕播放中...";
  
  drawVisualizerAndRadar();
  
  aSrc.onended = () => {
    if (!aLoopState && aPlayState) {
      aPlayState = false;
      aPlay.classList.add('off');
      aStop.classList.remove('off');
      aStatus.textContent = "播放完毕";
      if (animId) cancelAnimationFrame(animId);
      clearCanvases();
    }
  };
});

aStop.addEventListener('click', () => {
  if (aSrc) { try { aSrc.stop(); aSrc.disconnect(); } catch(e){} aSrc = null; }
  aPlayState = false;
  if (animId) cancelAnimationFrame(animId);
  aPlay.classList.add('off');
  aStop.classList.remove('off');
  aStatus.textContent = "⏹ 已停止播放";
  clearCanvases();
});

aLoop.addEventListener('click', () => {
  aLoopState = !aLoopState;
  aLoop.textContent = aLoopState ? "🔁 循环: 开" : "🔁 循环: 关";
  aLoop.className = aLoopState ? "" : "off";
  if (aSrc) aSrc.loop = aLoopState;
});

aVol.addEventListener('input', e => {
  const val = e.target.value;
  aVolVal.textContent = val + '%';
  if (aGain) aGain.gain.value = val / 100;
});

speedRange.addEventListener('input', e => {
  speedVal.textContent = e.target.value + 'x';
});

function clearCanvases() {
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  radarCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
  
  radarCtx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
  radarCtx.lineWidth = 1;
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 40, 0, Math.PI * 2);
  radarCtx.stroke();
  
  radarCtx.fillStyle = '#34d399';
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 4, 0, Math.PI * 2);
  radarCtx.fill();
  
  radarCtx.fillStyle = '#a7f3d0';
  radarCtx.font = '10px sans-serif';
  radarCtx.fillText("左耳 (L)", 115, 58);
  radarCtx.fillText("右耳 (R)", 210, 58);
  radarCtx.fillText("正前方", 152, 16);
}

function drawVisualizerAndRadar() {
  if (!aPlayState) return;
  animId = requestAnimationFrame(drawVisualizerAndRadar);
  
  const dataArray = new Uint8Array(aAnalyser.frequencyBinCount);
  aAnalyser.getByteFrequencyData(dataArray);
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  let xPos = 2;
  for (let i = 0; i < 6; i++) {
    let h = (dataArray[i] / 255) * aCanvas.height;
    aCanvasCtx.fillStyle = '#34d399';
    aCanvasCtx.fillRect(xPos, aCanvas.height - h, 3, h);
    xPos += 5;
  }

  radarCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
  radarCtx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
  radarCtx.lineWidth = 1;
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 40, 0, Math.PI * 2);
  radarCtx.stroke();
  
  radarCtx.fillStyle = '#34d399';
  radarCtx.beginPath();
  radarCtx.arc(170, 55, 4, 0, Math.PI * 2);
  radarCtx.fill();
  
  radarCtx.fillStyle = '#a7f3d0';
  radarCtx.font = '10px sans-serif';
  radarCtx.fillText("左耳 (L)", 115, 58);
  radarCtx.fillText("右耳 (R)", 210, 58);
  radarCtx.fillText("正前方", 152, 16);

  const mode = spatialMode.value;
  const speed = parseFloat(speedRange.value);

  if (aPanner) {
    angle += 0.015 * speed;
    let x = 0, z = -1;

    if (mode === 'classic8D') {
      x = Math.sin(angle) * 3.5;
      z = Math.cos(angle) * 3.5;
    } else if (mode === 'wideTheater') {
      x = Math.sin(angle) * 4.5;
      z = -1.5;
    } else if (mode === 'frontBack') {
      x = 0;
      z = Math.sin(angle) * 4;
    } else if (mode === 'staticCenter') {
      x = 0;
      z = -2;
    }

    aPanner.positionX.value = x;
    aPanner.positionZ.value = z;

    let radarX = 170 + (x / 4) * 40;
    let radarY = 55 - (z / 4) * 26;
    radarCtx.fillStyle = '#10b981';
    radarCtx.beginPath();
    radarCtx.arc(radarX, radarY, 5, 0, Math.PI * 2);
    radarCtx.fill();
  }
}

clearCanvases();

// 音频导出
aExportBtn.addEventListener('click', async () => {
  if (!aBuf) return;
  aStatus.textContent = "⏳ 正在离线渲染并打包带音效文件...";
  aExportBtn.disabled = true;

  try {
    const offlineCtx = new OfflineAudioContext(aBuf.numberOfChannels, aBuf.length, aBuf.sampleRate);
    const source = offlineCtx.createBufferSource();
    source.buffer = aBuf;
    source.loop = aLoopState;

    const f1 = offlineCtx.createBiquadFilter();
    const f2 = offlineCtx.createBiquadFilter();
    applyPresetEffect(aFxSelect.value, f1, f2, aFxInt.value / 100);

    const gain = offlineCtx.createGain();
    gain.gain.value = aVol.value / 100;

    source.connect(f1);
    f1.connect(f2);
    f2.connect(gain);
    gain.connect(offlineCtx.destination);

    source.start(0);
    const renderedBuffer = await offlineCtx.startRendering();

    const wavBlob = bufferToWav(renderedBuffer);
    const url = URL.createObjectURL(wavBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `INS_Processed_Audio_${Date.now()}.wav`;
    a.click();
    URL.revokeObjectURL(url);

    aStatus.textContent = "✅ 音效文件导出成功！";
  } catch (err) {
    aStatus.textContent = "❌ 导出失败，请重试";
  }
  aExportBtn.disabled = false;
});

function bufferToWav(abuffer) {
  const numOfChan = abuffer.numberOfChannels,
        length = abuffer.length * numOfChan * 2 + 44,
        out = new DataView(new ArrayBuffer(length)),
        channels = [];
  let sampleRate = abuffer.sampleRate, offset = 0, pos = 0;

  function writeString(str) {
    for (let i = 0; i < str.length; i++) {
      out.setUint8(pos++, str.charCodeAt(i));
    }
  }

  writeString('RIFF');
  out.setUint32(pos, length - 8, true); pos += 4;
  writeString('WAVE');
  writeString('fmt ');
  out.setUint32(pos, 16, true); pos += 4;
  out.setUint16(pos, 1, true); pos += 2;
  out.setUint16(pos, numOfChan, true); pos += 2;
  out.setUint32(pos, sampleRate, true); pos += 4;
  out.setUint32(pos, sampleRate * 2 * numOfChan, true); pos += 4;
  out.setUint16(pos, numOfChan * 2, true); pos += 2;
  out.setUint16(pos, 16, true); pos += 2;
  writeString('data');
  out.setUint32(pos, length - pos - 4, true); pos += 4;

  for (let i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

  while (offset < abuffer.length) {
    for (let i = 0; i < numOfChan; i++) {
      let sample = Math.max(-1, Math.min(1, channels[i][offset]));
      sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0;
      out.setInt16(pos, sample, true);
      pos += 2;
    }
    offset++;
  }
  return new Blob([out.buffer], {type: 'audio/wav'});
}


// --- 视频区引擎状态 ---
const vFile = document.getElementById('vFile');
const vElement = document.getElementById('vElement');
const vPlay = document.getElementById('vPlay');
const vStop = document.getElementById('vStop');
const vLoop = document.getElementById('vLoop');
const vFxSelect = document.getElementById('vFxSelect');
const vFxInt = document.getElementById('vFxInt');
const vFxIntVal = document.getElementById('vFxIntVal');
const vVol = document.getElementById('vVol');
const vVolVal = document.getElementById('vVolVal');
const vStatus = document.getElementById('vStatus');
const vExportBtn = document.getElementById('vExportBtn');

let vCtx, vSourceNode, vEq1, vEq2, vGainNode;
let vLoopState = false;

function initVideoAudioContext() {
  if (vCtx) return;
  vCtx = new (window.AudioContext || window.webkitAudioContext)();
  vSourceNode = vCtx.createMediaElementSource(vElement);
  vEq1 = vCtx.createBiquadFilter();
  vEq2 = vCtx.createBiquadFilter();
  vGainNode = vCtx.createGain();
  vGainNode.gain.value = vVol.value / 100;

  vSourceNode.connect(vEq1);
  vEq1.connect(vEq2);
  vEq2.connect(vGainNode);
  vGainNode.connect(vCtx.destination);
}

vFile.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  vElement.src = url;
  vPlay.disabled = false;
  vStop.disabled = false;
  vLoop.disabled = false;
  vExportBtn.disabled = false;
  vStatus.textContent = "✅ 视频文件加载成功，点击播放";
});

vFxSelect.addEventListener('change', e => {
  if (vCtx && vEq1) {
    applyPresetEffect(e.target.value, vEq1, vEq2, vFxInt.value / 100);
  }
  vStatus.textContent = `视频音效已同步: ${e.options[e.selectedIndex].text}`;
});

vFxInt.addEventListener('input', e => {
  const val = e.target.value;
  vFxIntVal.textContent = val + '%';
  if (vCtx && vEq1) {
    applyPresetEffect(vFxSelect.value, vEq1, vEq2, val / 100);
  }
});

vVol.addEventListener('input', e => {
  const val = e.target.value;
  vVolVal.textContent = val + '%';
  if (vGainNode) vGainNode.gain.value = val / 100;
});

vPlay.addEventListener('click', () => {
  initVideoAudioContext();
  if (vCtx.state === 'suspended') vCtx.resume();
  applyPresetEffect(vFxSelect.value, vEq1, vEq2, vFxInt.value / 100);
  
  vElement.loop = vLoopState;
  vElement.play();
  
  vPlay.classList.remove('off');
  vStop.classList.add('off');
  vStatus.textContent = "▶ 视频带音效播放中...";
});

vStop.addEventListener('click', () => {
  vElement.pause();
  vElement.currentTime = 0;
  vPlay.classList.add('off');
  vStop.classList.remove('off');
  vStatus.textContent = "⏹ 视频已停止";
});

vLoop.addEventListener('click', () => {
  vLoopState = !vLoopState;
  vElement.loop = vLoopState;
  vLoop.textContent = vLoopState ? "🔁 循环: 开" : "🔁 循环: 关";
  vLoop.className = vLoopState ? "" : "off";
});

vElement.onended = () => {
  if (!vLoopState) {
    vPlay.classList.add('off');
    vStop.classList.remove('off');
    vStatus.textContent = "视频播放完毕";
  }
};

// 视频导出
vExportBtn.addEventListener('click', async () => {
  if (!vElement.src) return;
  vStatus.textContent = "⏳ 正在录制并导出带音效视频文件...";
  vExportBtn.disabled = true;

  try {
    initVideoAudioContext();
    vElement.currentTime = 0;
    vElement.play();

    const dest = vCtx.createMediaStreamDestination();
    vGainNode.connect(dest);

    const videoStream = vElement.captureStream ? vElement.captureStream() : vElement.mozCaptureStream();
    const combinedStream = new MediaStream([
      ...videoStream.getVideoTracks(),
      ...dest.stream.getAudioTracks()
    ]);

    const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp8,opus' });
    let chunks = [];

    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `INS_Processed_Video_${Date.now()}.webm`;
      a.click();
      URL.revokeObjectURL(url);
      vStatus.textContent = "✅ 带音效视频文件导出成功！";
      vExportBtn.disabled = false;
    };

    recorder.start();
    
    vElement.onended = () => {
      if (recorder.state === 'recording') recorder.stop();
      vElement.onended = null;
    };

    setTimeout(() => {
      if (recorder.state === 'recording') {
        vElement.pause();
        recorder.stop();
      }
    }, Math.min(vElement.duration * 1000 || 15000, 30000));

  } catch (err) {
    vStatus.textContent = "❌ 视频导出失败（部分浏览器不支持流录制）";
    vExportBtn.disabled = false;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>完全独立双模播放器 - Ins 绿调高级版</title>
  <style>
    body { background: #0b0f0e; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #131c18; padding: 20px; border-radius: 18px; width: 100%; max-width: 380px; margin-bottom: 16px; border: 1px solid rgba(52, 211, 153, 0.15); box-sizing: border-box; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h3 { margin: 0; font-size: 14px; color: #34d399; font-weight: 600; letter-spacing: 0.5px; }
    
    /* 音浪浮动标志（Canvas画布样式） */
    .visualizer { width: 45px; height: 20px; background: rgba(0,0,0,0.3); border-radius: 6px; display: block; border: 1px solid rgba(52, 211, 153, 0.1); }

    input[type="file"] { width: 100%; margin: 8px 0; color: #a7f3d0; font-size: 12px; }
    input[type="file"]::file-selector-button { background: #064e3b; color: #34d399; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: 0.2s; }
    input[type="file"]::file-selector-button:hover { background: #047857; color: #fff; }

    button { width: 100%; padding: 8px; margin: 4px 0; background: #059669; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s ease; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button.off { background: #1f2923; color: #6b7280; border: 1px solid rgba(255,255,255,0.05); }
    button:disabled { opacity: 0.25; transform: none; cursor: not-allowed; }
    
    video { width: 100%; border-radius: 10px; margin-top: 8px; background: #000; border: 1px solid rgba(52, 211, 153, 0.1); }
    .tip { font-size: 11px; color: #34d399; margin-top: 8px; font-weight: 400; opacity: 0.9; }
    
    .control-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    .btn-group { flex: 1; display: flex; flex-direction: column; }
    
    .volume-box { width: 45px; background: rgba(52, 211, 153, 0.03); border: 1px solid rgba(52, 211, 153, 0.1); border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 6px 0; justify-content: space-between; height: 135px; box-sizing: border-box; }
    .volume-box label { font-size: 9px; color: #6ee7b7; margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
    .volume-box span { font-size: 10px; font-weight: 600; color: #a7f3d0; margin-top: 2px; }
    .vertical-slider-wrapper { height: 85px; display: flex; align-items: center; justify-content: center; }
    input[type="range"].vertical {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      width: 6px; height: 80px; padding: 0; margin: 0;
      background: rgba(52, 211, 153, 0.15); outline: none; border-radius: 4px;
    }
    input[type="range"].vertical::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px; border-radius: 50%;
      background: #34d399; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h3>🎵 独立音频区 (MP3 / WAV)</h3>
    <canvas id="aCanvas" class="visualizer" width="45" height="20"></canvas>
  </div>
  <input type="file" id="aFile" accept=".mp3,.wav">
  <div class="control-row">
    <div class="btn-group">
      <button id="aPlay" disabled>播放音频</button>
      <button id="aStop" disabled>停止音频</button>
      <button id="aLoop" class="off" disabled>🔁 循环播放: 关</button>
      <button id="aToggle" class="off" disabled>🌀 8D 环绕: 关闭</button>
    </div>
    <div class="volume-box">
      <label>8D速度</label>
      <div class="vertical-slider-wrapper">
        <input type="range" id="aSpeed" class="vertical" min="1" max="10" value="4">
      </div>
      <span id="aSpeedVal">0.04</span>
    </div>
    <div class="volume-box">
      <label>音量</label>
      <div class="vertical-slider-wrapper">
        <input type="range" id="aVol" class="vertical" min="0" max="100" value="80">
      </div>
      <span id="aVolVal">80%</span>
    </div>
  </div>
  <div class="tip" id="aStatus">等待选择音频...</div>
</div>

<div class="card">
  <div class="card-header">
    <h3>🎬 独立视频区 (MP4)</h3>
    <canvas id="vCanvas" class="visualizer" width="45" height="20"></canvas>
  </div>
  <input type="file" id="vFile" accept=".mp4,.mov">
  <video id="vEl" controls playsinline></video>
  <div class="control-row" style="margin-top: 10px;">
    <div class="btn-group">
      <button id="vLoop" class="off" disabled>🔁 循环播放: 关</button>
      <button id="vToggle" class="off" disabled>🌀 视频 8D: 关闭</button>
    </div>
    <div class="volume-box">
      <label>8D速度</label>
      <div class="vertical-slider-wrapper">
        <input type="range" id="vSpeed" class="vertical" min="1" max="10" value="4">
      </div>
      <span id="vSpeedVal">0.04</span>
    </div>
    <div class="volume-box">
      <label>音量</label>
      <div class="vertical-slider-wrapper">
        <input type="range" id="vVol" class="vertical" min="0" max="100" value="80">
      </div>
      <span id="vVolVal">80%</span>
    </div>
  </div>
  <div class="tip" id="vStatus">等待选择视频...</div>
</div>

<script>
// 音频逻辑
let aCtx, aPanner, aGain, aAnalyser, aBuf, aSrc, aPlayState = false, a8d = false, aAngle = 0, aAnim, aLoopState = false, aSpeedStep = 0.04;
const aFile = document.getElementById('aFile'), aPlay = document.getElementById('aPlay'), aStop = document.getElementById('aStop'), aLoop = document.getElementById('aLoop'), aToggle = document.getElementById('aToggle'), aStatus = document.getElementById('aStatus'), aVol = document.getElementById('aVol'), aVolVal = document.getElementById('aVolVal'), aSpeed = document.getElementById('aSpeed'), aSpeedVal = document.getElementById('aSpeedVal'), aCanvas = document.getElementById('aCanvas');
const aCanvasCtx = aCanvas.getContext('2d');

aFile.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  if (!aCtx) {
    aCtx = new (window.AudioContext || window.webkitAudioContext)();
    aAnalyser = aCtx.createAnalyser();
    aAnalyser.fftSize = 32;
    aPanner = aCtx.createPanner(); aPanner.panningModel = 'HRTF';
    aGain = aCtx.createGain(); aGain.gain.value = aVol.value / 100;
    
    aPanner.connect(aAnalyser);
    aAnalyser.connect(aGain); 
    aGain.connect(aCtx.destination);
  }
  if (aCtx.state === 'suspended') aCtx.resume();
  aStatus.textContent = "解码中...";
  aBuf = await aCtx.decodeAudioData(await f.arrayBuffer());
  aPlay.disabled = false; aStop.disabled = false; aLoop.disabled = false; aToggle.disabled = false;
  aStatus.textContent = "音频就绪";
});

aPlay.addEventListener('click', () => {
  if (aSrc) { aSrc.stop(); aSrc.disconnect(); }
  aSrc = aCtx.createBufferSource(); 
  aSrc.buffer = aBuf;
  aSrc.loop = aLoopState;
  aSrc.connect(aPanner); 
  aSrc.start(0);
  aPlayState = true; 
  aStatus.textContent = "▶ 音频播放中";
  if (a8d) runAOrbit();
  drawAVisualizer();

  aSrc.onended = () => {
    if (!aLoopState && aPlayState) {
      aPlayState = false;
      cancelAnimationFrame(aAnim);
      if (aPanner) { aPanner.positionX.value = 0; aPanner.positionZ.value = 1; }
      aStatus.textContent = "音频播放完毕";
      clearCanvas(aCanvasCtx, aCanvas);
    }
  };
});

aStop.addEventListener('click', () => {
  if (aSrc) { aSrc.stop(); aSrc.disconnect(); aSrc = null; }
  aPlayState = false; cancelAnimationFrame(aAnim);
  if (aPanner) { aPanner.positionX.value = 0; aPanner.positionZ.value = 1; }
  aStatus.textContent = "已停止";
  clearCanvas(aCanvasCtx, aCanvas);
});

aLoop.addEventListener('click', () => {
  aLoopState = !aLoopState;
  aLoop.textContent = aLoopState ? "🔁 循环播放: 开" : "🔁 循环播放: 关";
  aLoop.className = aLoopState ? "" : "off";
  if (aSrc) { aSrc.loop = aLoopState; }
});

aToggle.addEventListener('click', () => {
  a8d = !a8d;
  aToggle.textContent = a8d ? "🌀 8D 环绕: 开启" : "🌀 8D 环绕: 关闭";
  aToggle.className = a8d ? "" : "off";
  if (a8d && aPlayState) runAOrbit();
  else { cancelAnimationFrame(aAnim); if (aPanner) { aPanner.positionX.value = 0; aPanner.positionZ.value = 1; } }
});

aVol.addEventListener('input', e => {
  const val = e.target.value;
  aVolVal.textContent = val + '%';
  if (aGain) aGain.gain.value = val / 100;
});

aSpeed.addEventListener('input', e => {
  const val = e.target.value;
  aSpeedStep = val * 0.01;
  aSpeedVal.textContent = aSpeedStep.toFixed(2);
});

function runAOrbit() {
  if (!a8d) return;
  aAngle += aSpeedStep;
  if (aPanner) { aPanner.positionX.value = Math.cos(aAngle) * 2; aPanner.positionZ.value = Math.sin(aAngle) * 2; }
  aAnim = requestAnimationFrame(runAOrbit);
}

function drawAVisualizer() {
  if (!aPlayState) return;
  requestAnimationFrame(drawAVisualizer);
  const dataArray = new Uint8Array(aAnalyser.frequencyBinCount);
  aAnalyser.getByteFrequencyData(dataArray);
  
  aCanvasCtx.clearRect(0, 0, aCanvas.width, aCanvas.height);
  const barWidth = 3;
  let x = 2;
  for (let i = 0; i < 6; i++) {
    let barHeight = (dataArray[i] / 255) * aCanvas.height;
    aCanvasCtx.fillStyle = '#34d399';
    aCanvasCtx.fillRect(x, aCanvas.height - barHeight, barWidth, barHeight);
    x += 5;
  }
}

// 视频逻辑
let vCtx, vPanner, vGain, vAnalyser, vNode, v8d = false, vAngle = 0, vAnim, vSpeedStep = 0.04;
const vFile = document.getElementById('vFile'), vEl = document.getElementById('vEl'), vLoop = document.getElementById('vLoop'), vToggle = document.getElementById('vToggle'), vStatus = document.getElementById('vStatus'), vVol = document.getElementById('vVol'), vVolVal = document.getElementById('vVolVal'), vSpeed = document.getElementById('vSpeed'), vSpeedVal = document.getElementById('vSpeedVal'), vCanvas = document.getElementById('vCanvas');
const vCanvasCtx = vCanvas.getContext('2d');

vFile.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  vEl.src = URL.createObjectURL(f);
  vEl.load(); vLoop.disabled = false; vToggle.disabled = false;
  vStatus.textContent = "视频已加载";
});

vLoop.addEventListener('click', () => {
  vEl.loop = !vEl.loop;
  vLoop.textContent = vEl.loop ? "🔁 循环播放: 开" : "🔁 循环播放: 关";
  vLoop.className = vEl.loop ? "" : "off";
});

vEl.addEventListener('play', () => {
  if (!vCtx) {
    vCtx = new (window.AudioContext || window.webkitAudioContext)();
    vAnalyser = vCtx.createAnalyser();
    vAnalyser.fftSize = 32;
    vPanner = vCtx.createPanner(); vPanner.panningModel = 'HRTF';
    vGain = vCtx.createGain(); vGain.gain.value = vVol.value / 100;
    vNode = vCtx.createMediaElementSource(vEl);
    
    vNode.connect(vPanner); 
    vPanner.connect(vAnalyser);
    vAnalyser.connect(vGain); 
    vGain.connect(vCtx.destination);
  }
  if (vCtx.state === 'suspended') vCtx.resume();
  if (v8d) runVOrbit();
  drawVVisualizer();
  vStatus.textContent = "🎬 视频播放中 (带 8D)";
});

vEl.addEventListener('pause', () => {
  cancelAnimationFrame(vAnim);
  vStatus.textContent = "视频已暂停";
  clearCanvas(vCanvasCtx, vCanvas);
});

vEl.addEventListener('ended', () => {
  clearCanvas(vCanvasCtx, vCanvas);
});

vToggle.addEventListener('click', () => {
  v8d = !v8d;
  vToggle.textContent = v8d ? "🌀 视频 8D: 开启" : "🌀 视频 8D: 关闭";
  vToggle.className = v8d ? "" : "off";
  if (v8d && !vEl.paused) runVOrbit();
  else { cancelAnimationFrame(vAnim); if (vPanner) { vPanner.positionX.value = 0; vPanner.positionZ.value = 1; } }
});

vVol.addEventListener('input', e => {
  const val = e.target.value;
  vVolVal.textContent = val + '%';
  if (vGain) vGain.gain.value = val / 100;
});

vSpeed.addEventListener('input', e => {
  const val = e.target.value;
  vSpeedStep = val * 0.01;
  vSpeedVal.textContent = vSpeedStep.toFixed(2);
});

function runVOrbit() {
  if (!v8d) return;
  vAngle += vSpeedStep;
  if (vPanner) { vPanner.positionX.value = Math.cos(vAngle) * 2; vPanner.positionZ.value = Math.sin(vAngle) * 2; }
  vAnim = requestAnimationFrame(runVOrbit);
}

function drawVVisualizer() {
  if (vEl.paused || vEl.ended) return;
  requestAnimationFrame(drawVVisualizer);
  const dataArray = new Uint8Array(vAnalyser.frequencyBinCount);
  vAnalyser.getByteFrequencyData(dataArray);
  
  vCanvasCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);
  const barWidth = 3;
  let x = 2;
  for (let i = 0; i < 6; i++) {
    let barHeight = (dataArray[i] / 255) * vCanvas.height;
    vCanvasCtx.fillStyle = '#34d399';
    vCanvasCtx.fillRect(x, vCanvas.height - barHeight, barWidth, barHeight);
    x += 5;
  }
}

function clearCanvas(ctx, canvas) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}
</script>
</body>
</html>
